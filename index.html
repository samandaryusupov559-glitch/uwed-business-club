$("resetScores").addEventListener("click",function(){ask({title:t("jd.resetQ"),ok:t("jd.reset"),danger:true}).then(function(ok){if(!ok)return;J.scores=blankScores();if(!findMatchPending(J.matchId))J.names=["",""];revealed=false;lastWinner=null;saveJ();renderJudge()})});
$("revealBtn").addEventListener("click",function(){

var cdTimer=null;
function runReveal(){
  ac();revealed=false;lastWinner=null;renderCompare();
  $("winOv").hidden=false;$("winOv").classList.remove("won");document.body.style.overflow="hidden";$("cdWrap").hidden=false;$("winWrap").hidden=true;

function finishReveal(){
  $("cdWrap").hidden=true;$("winWrap").hidden=false;$("winOv").classList.add("won");
  var a=totals(0).avg,b=totals(1).avg,na=J.names[0]||t("jd.team",{n:1}),nb=J.names[1]||t("jd.team",{n:2});revealed=true;

    var m=findMatchPending(J.matchId);if(m){recordResult(m.id,wi===0?m.teamA:m.teamB,a,b);J.matchId="";saveJ();$("winNote").textContent="✓ "+t("ov.recorded");fillMatchSel()}
    fanfare();try{confetti()}catch(e){}}

  $("winBreak").innerHTML=[0,1,2].map(function(j){return "<div><b>"+esc(t("jd.judge",{n:j+1}))+'</b><span class="num">'+(+t0[j].toFixed(1))+" : "+(+t1[j].toFixed(1))+"</span></div>"}).join("");

/* confetti */
var cfId=null;
function confetti(){var cv=$("confetti"),cx=cv.getContext&&cv.getContext("2d");if(!cx)return;var dpr=Math.min(2,window.devicePixelRatio||1);cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;cx.scale(dpr,dpr);
  var W=cv.offsetWidth,H=cv.offsetHeight,cols=["#9C2A42","#7A1B2E","#FAF6EF","#B8893B","#3A4E86"],P=[];
  for(var i=0;i<170;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.7,w:5+Math.random()*6,h:8+Math.random()*7,c:cols[i%cols.length],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*360,vr:-8+Math.random()*16});
  var f=0;cancelAnimationFrame(cfId);(function step(){f++;cx.clearRect(0,0,W,H);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});if(f<360)cfId=requestAnimationFrame(step);else cx.clearRect(0,0,W,H)})()}
function stopConfetti(){cancelAnimationFrame(cfId);try{var cv=$("confetti"),cx=cv.getContext("2d");if(cx)cx.clearRect(0,0,cv.width,cv.height)}catch(e){}}

/* =========================================================
   LINKED DEVICES — works in the standalone file.
   Each device connects to public MQTT brokers (two at once, for
   resilience) and talks on topics under a random room code.
   Admin (timekeeper):  publishes session / timer / reveal, reads scores.
   Judge (#judge=CODE): publishes its own score/<n>, reads everything.
   Screen (#screen=CODE): reads everything, shows timer / board / reveal.
========================================================= */
var BROKERS=(function(){try{var q=new URLSearchParams(location.search).get("broker");if(q)return q.split(",")}catch(e){}
  var x=store.get("uwedbc.brokers",null);if(Array.isArray(x)&&x.length)return x;
  return ["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"]})();
var DEV=store.get("uwedbc.dev",null);if(!DEV){DEV=Math.random().toString(36).slice(2,10);store.set("uwedbc.dev",DEV)}
var ROOM_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genRoom(){var r=null;try{r=crypto.getRandomValues(new Uint32Array(8))}catch(e){}var s="";for(var i=0;i<8;i++)s+=ROOM_ABC[(r?r[i]:Math.floor(Math.random()*1e9))%ROOM_ABC.length];return s}
function normRoom(v){return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8)}
function fmtRoom(c){return c?c.slice(0,4)+"-"+c.slice(4):""}
function makeHub(room,subs,will,onMsg,onStatus){
  if(typeof mqtt==="undefined"||!mqtt.connect){onStatus(-1);return null}
  var base="uwedbc/v1/"+room+"/",clients=[],latest={},seq=0,ended=false,failTimer=null;
  function st(){if(ended)return;var n=clients.filter(function(c){return c.connected}).length;onStatus(n)}
  BROKERS.forEach(function(url){
    var o={clientId:"ubc_"+DEV+"_"+Math.random().toString(36).slice(2,7),clean:true,connectTimeout:10000,reconnectPeriod:4000,keepalive:30,protocolVersion:4};
    if(will)o.will={topic:base+will.topic,payload:JSON.stringify(Object.assign({},will.data,{dev:DEV})),qos:1,retain:true};
    var c;try{c=mqtt.connect(url,o)}catch(e){return}
    clients.push(c);
    c.on("connect",function(){c.subscribe(subs.map(function(x){return base+x}),{qos:1});st()});
    c.on("close",st);c.on("offline",st);c.on("error",function(){});
    c.on("message",function(topic,payload){
      if(topic.indexOf(base)!==0)return;var key=topic.slice(base.length),txt=payload?payload.toString():"",d=null;
      if(txt){try{d=JSON.parse(txt)}catch(e){return}}
      var prev=latest[key];
      if(key.indexOf("presence/")!==0&&d&&prev&&d.at!=null&&prev.at!=null){if(d.at<prev.at||(d.at===prev.at&&(d.seq||0)<=(prev.seq||0)))return}
      if(!d&&!prev&&key.indexOf("presence/")!==0)return;
      latest[key]=d;try{onMsg(key,d)}catch(e){}
    });
  });
  failTimer=setTimeout(st,12000);st();
  return {
    pub:function(key,data){var body=data?Object.assign({},data,{at:Date.now(),seq:++seq,dev:DEV}):null,txt=body?JSON.stringify(body):"";
      clients.forEach(function(c){try{c.publish(base+key,txt,{qos:1,retain:true})}catch(e){}});
      latest[key]=body;return body},
    end:function(){ended=true;clearTimeout(failTimer);clients.forEach(function(c){try{c.end(true)}catch(e){}});clients=[]},
    latest:latest,connected:function(){return clients.some(function(c){return c.connected})}
  };
}

    return;
  }
  h+='<div class="jv-bar"><span class="tag m">'+esc(t("lv.judge",{n:JV.n}))+'</span><span class="tag num">'+esc(fmtRoom(JV.room))+'</span><span class="tag" id="jvConn"></span><button class="btn btn-ghost btn-sm sp" type="button" id="jvLeave">'+esc(t("jv.leave"))+"</button></div>";
  var S=JV.session;
  if(!S||!S.open){
    h+='<div class="jv-card wait">'+(S&&!S.open&&JV.sid===S.sid&&filledCount(JV.scores)?'<h2>'+esc(t("jv.closed"))+"</h2>":'<div class="spin"></div><h2 style="font-size:22px">'+esc(t("jv.wait"))+'</h2><p class="note" style="margin:0">'+esc(t("jv.waitSub"))+"</p>")+'</div><div id="jvOthers"></div>';
  }else{
    h+='<div class="jv-match"><small>'+esc(t("jd.match"))+"</small><b>"+esc(S.names[0])+"<i>VS</i>"+esc(S.names[1])+"</b></div>";
    if(JV.clash)h+='<div class="status err" style="margin:0 0 12px">'+esc(t("jv.taken",{n:JV.n}))+"</div>";
    h+='<div class="tswitch" id="jvTeams">'+[0,1].map(function(i){return '<button type="button" data-team="'+i+'" aria-pressed="'+(JV.active===i)+'"><span class="k">'+(i+1)+'</span><span class="tx"><b>'+esc(S.names[i])+'</b><small class="num" id="jvTt'+i+'">'+esc(t("jd.total"))+": "+sumCol(JV.scores,i)+"</small></span></button>"}).join("")+"</div>";
    var crit=CRIT[L],ti=JV.active;
    crit.forEach(function(c,ci){var v=JV.scores[ti][ci],bad=String(v).trim()!==""&&num(v)>MAX[ci];
      h+='<div class="crit-card" style="animation-delay:'+(ci*0.04)+'s"><div class="top"><div><b>'+(ci+1)+". "+esc(c[0])+' <span class="mx">/ '+MAX[ci]+"</span></b><p>"+esc(c[1])+'</p></div><input class="sin num'+(bad?" bad":"")+(String(v).trim()!==""?" fill":"")+'" type="text" inputmode="decimal" autocomplete="off" maxlength="5" data-c="'+ci+'" value="'+esc(v)+'" placeholder="0" aria-label="'+esc(c[0])+'"></div><div class="others" id="jvO'+ci+'"></div></div>'});
    h+='<div class="jv-tot" id="jvTot"></div>';
  }
  h+="</div>";
  if(S&&S.open)h+='<div class="jv-foot"><div class="in"><div class="st" id="jvSt"></div><button class="btn btn-primary btn-lg" type="button" id="jvSend"></button></div></div>';
  app.innerHTML=h;
  $("jvLeave").onclick=function(){if(JV.hub){try{JV.hub.pub("presence/"+JV.n,{judge:JV.n,online:false})}catch(e){}JV.hub.end()}JV.joined=false;JV.hub=null;JV.conn=0;JV.session=null;JV.docs={};JV.sid=null;renderJV()};
  if(S&&S.open){
    $("jvTeams").onclick=function(e){var b=e.target.closest("[data-team]");if(!b)return;JV.active=+b.dataset.team;renderJV();window.scrollTo(0,0)};
    var inputs=app.querySelectorAll(".sin");
    inputs.forEach(function(x){
      x.addEventListener("input",function(){x.value=x.value.replace(/[^\d.,]/g,"");var ci=+x.dataset.c;JV.scores[JV.active][ci]=x.value;x.classList.toggle("bad",x.value.trim()!==""&&num(x.value)>MAX[ci]);x.classList.toggle("fill",x.value.trim()!=="");
        JV.submitted=false;JV.dirty=true;jvSaveDraft();clearTimeout(jvTimer);jvTimer=setTimeout(function(){jvPublish(false)},700);renderJVOthers();renderJVFoot()});
      x.addEventListener("blur",function(){if(x.value.trim()==="")return;var ci=+x.dataset.c,v=Math.round(Math.max(0,Math.min(MAX[ci],num(x.value)))*10)/10;if(String(v)!==x.value){x.value=String(v);JV.scores[JV.active][ci]=x.value;x.classList.remove("bad");jvSaveDraft();clearTimeout(jvTimer);jvTimer=setTimeout(function(){jvPublish(false)},300);renderJVOthers()}});
      x.addEventListener("keydown",function(e){if(e.key!=="Enter")return;var a=[].slice.call(inputs),i=a.indexOf(x);if(a[i+1]){e.preventDefault();a[i+1].focus()}else x.blur()});
    });
    $("jvSend").onclick=function(){var e2=MAX.length*2-filledCount(JV.scores);
      (e2?ask({title:t("jd.incompleteQ"),body:t("jv.emptyBody",{n:e2}),ok:t("jv.send")}):Promise.resolve(true)).then(function(ok){if(!ok)return;JV.submitted=true;JV.sentAt=Date.now();jvSaveDraft();jvPublish(true);beep(880,.15,"triangle",.12);renderJVFoot();renderJVOthers()})};
  }
  renderJVStatus();renderJVOthers();renderJVFoot();
}
function renderJVStatus(){var el=$("jvConn");if(!el)return;el.className="tag "+(JV.conn>0?"o":"x");el.textContent=JV.conn>0?t("lv.online"):(JV.conn<0?t("lv.nolib"):t("jv.connecting"));renderJVFoot()}
function renderJVFoot(){var st=$("jvSt"),b=$("jvSend");if(!st||!b)return;
  b.textContent=JV.submitted?t("jv.resend"):t("jv.send");
  if(JV.conn<=0){st.className="st w";st.textContent=t("jv.offline");return}
  if(JV.submitted){st.className="st ok";st.textContent="✓ "+t("jv.sentAt",{time:nowTime(JV.sentAt||Date.now())});return}
  st.className="st";st.textContent=filledCount(JV.scores)?(JV.sentAt?t("jv.edited"):t("jv.draft")):"";
}
function renderJVOthers(){
  if(!JV||!JV.session||!JV.session.open)return;var docs=judgeDocs(JV),ti=JV.active;
  MAX.forEach(function(_,ci){var el=$("jvO"+ci);if(!el)return;var h="";
    for(var n=1;n<=JUDGES;n++){if(n===JV.n)continue;var d=docs[n],v=d&&d.scores&&d.scores[ti]?d.scores[ti][ci]:"";
      h+='<span class="'+(d&&d.submitted?"s":"")+'">'+esc(t("jd.judge",{n:n}))+": "+(String(v==null?"":v).trim()===""?"—":esc(v))+"</span>"}
    el.innerHTML=h});
  var tot=$("jvTot");if(tot){var h="";for(var n=1;n<=JUDGES;n++){var sc=n===JV.n?JV.scores:(docs[n]?docs[n].scores:null);
    h+='<div class="'+(n===JV.n?"me":"")+'"><small>'+esc(t("jd.judge",{n:n}))+'</small><b class="num">'+(sc?sumCol(sc,ti):"—")+"</b></div>"}tot.innerHTML=h}
  [0,1].forEach(function(i){var el=$("jvTt"+i);if(el)el.textContent=t("jd.total")+": "+sumCol(JV.scores,i)});
}

/* ---------------- SCREEN VIEW ---------------- */
var SV=null;
function bootScreen(roomFromHash){
  SV={room:normRoom(roomFromHash||store.get("uwedbc.sv","")),hub:null,conn:0,session:null,timer:null,reveal:null,docs:{},pres:{},lastRevealState:null,cdShown:null};
  if(SV.room.length===8)svConnect();else renderSV();
  setInterval(svTick,250);
}
function svConnect(){store.set("uwedbc.sv",SV.room);
  SV.hub=makeHub(SV.room,["session","timer","reveal","score/+","presence/+"],null,function(key,d){
    if(key==="session")SV.session=d;else if(key==="timer")SV.timer=d;else if(key==="reveal"){SV.reveal=d;svRevealChanged()}
    else{var n=+key.split("/")[1];if(key.indexOf("presence/")===0)SV.pres[n]=d;else SV.docs[n]=d}
    renderSV()},function(c){SV.conn=c;renderSV()});
  renderSV();
}
function svRevealChanged(){var r=SV.reveal;if(!r)return;
  if(r.state==="cd"&&SV.lastRevealState!=="cd"){SV.cdStart=Date.now()-Math.max(0,Math.min(r.n*1000,Date.now()-r.at))}
  if(r.state==="res"&&SV.lastRevealState!=="res"){fanfare()}
  SV.lastRevealState=r.state}
function svRem(){var d=SV.timer;if(!d)return null;if(!d.run)return d.rem;var el=(Date.now()-d.at)/1000;if(el<0||el>d.rem+30)el=0;return Math.max(0,d.rem-el)}
function boardHTML(docs,names){
  return '<div class="sv-board">'+[0,1].map(function(ti){var h="<div><h3>"+esc(names[ti])+"</h3><table><thead><tr><th>"+esc(t("jd.crit"))+"</th>";
    for(var n=1;n<=JUDGES;n++)h+="<th>"+esc(t("jd.judge",{n:n}))+"</th>";h+="</tr></thead><tbody>";
    CRIT[L].forEach(function(c,ci){h+="<tr><td>"+esc(c[0])+' <span style="opacity:.55">/'+MAX[ci]+"</span></td>";for(var n=1;n<=JUDGES;n++){var d=docs[n],v=d&&d.scores&&d.scores[ti]?d.scores[ti][ci]:"";h+="<td>"+(String(v==null?"":v).trim()===""?"—":esc(v))+"</td>"}h+="</tr>"});
    h+="</tbody><tfoot><tr><td>"+esc(t("jd.total"))+"</td>";for(var n=1;n<=JUDGES;n++){var d=docs[n];h+="<td>"+(d?sumCol(d.scores,ti):"—")+"</td>"}
    return h+"</tr></tfoot></table></div>"}).join("")+"</div>";
}
function renderSV(){
  var app=$("modeApp");
  var top='<div class="sv-top"><img src="'+$("brandLink").querySelector("img").src+'" alt=""><div class="nm">UWED Business Club</div><div class="sp"><span class="livepill '+(SV.conn>0?"on":SV.conn<0?"bad":"")+'" style="background:rgba(250,246,239,.1);color:var(--cream)"><i></i><span>'+esc(fmtRoom(SV.room))+'</span></span><button class="btn btn-ghost btn-sm" type="button" id="svSound">'+esc(t("sv.sound"))+'</button><button class="btn btn-ghost btn-sm" type="button" id="svFull"><svg><use href="#i-screen"/></svg></button></div></div>';
  var main="";
  if(SV.room.length!==8){
    main='<div class="sv-join"><div class="sv-phase" style="margin:0">'+esc(t("sv.enterRoom"))+'</div><input class="input roomin" id="svRoom" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button class="btn btn-primary btn-lg" type="button" id="svGo">'+esc(t("jv.join"))+"</button></div>";
  }else{
    var S=SV.session,R=SV.reveal,docs=judgeDocs(SV);
    var names=R&&R.names?R.names:(S?S.names:null);
    if(R&&R.state==="cd"){main='<div class="ov-k">'+esc(t("ov.announcing"))+'</div><div class="cd num" id="svCd">'+R.n+"</div>"}
    else if(R&&R.state==="res"){
      var tie=R.win<0;main='<div class="ov-k">'+esc(tie?t("ov.tie"):t("ov.winner"))+'</div><div class="win-name">'+esc(tie?R.names.join(" · "):R.names[R.win])+'</div><div class="win-sc num">'+esc(R.names[0])+"  "+(+R.avg[0]).toFixed(1)+"  ·  "+(+R.avg[1]).toFixed(1)+"  "+esc(R.names[1])+'</div><div class="win-break">'+[0,1,2].map(function(j){return "<div><b>"+esc(t("jd.judge",{n:j+1}))+'</b><span class="num">'+(+(+R.jt[0][j]).toFixed(1))+" : "+(+(+R.jt[1][j]).toFixed(1))+"</span></div>"}).join("")+"</div>";
    }
    else if(S&&S.show){main='<div class="sv-small num" id="svMini"></div>'+boardHTML(docs,S.names)}
    else{
      var p=SV.timer?PH[SV.timer.i]||PH[0]:null;
      main=(names?'<div class="sv-teams">'+esc(names[0])+"<i>VS</i>"+esc(names[1])+"</div>":"")+
        '<div class="sv-phase">'+esc(p?t(p.t)+" · "+t("tm.step",{i:SV.timer.i+1,n:SV.timer.n}):t("sv.wait"))+'</div><div class="sv-time" id="svTime">--:--</div><div class="pres-bar"><i id="svBar"></i></div>';
      if(S&&S.open){main+='<div class="sv-chips">';for(var n=1;n<=JUDGES;n++){var d=docs[n];main+='<span class="'+(d&&d.submitted?"s":"")+'">'+esc(t("jd.judge",{n:n}))+" "+(d&&d.submitted?"✓":d?"✎":"…")+"</span>"}main+="</div>"}
    }
  }
  app.innerHTML='<div class="sv"><div class="rays'+(SV.reveal&&SV.reveal.state==="res"?"":" soft")+'" style="opacity:'+(SV.reveal&&SV.reveal.state==="res"?1:0)+'"></div>'+top+'<div class="sv-main">'+main+"</div></div>";
  $("svSound").onclick=function(){ac();beep(660,.15,"sine",.15);this.hidden=true};
  $("svFull").onclick=function(){try{var r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(function(){})}catch(e){}};
  if($("svGo")){$("svRoom").oninput=function(){var v=normRoom(this.value);this.value=v.length>4?fmtRoom(v):v};$("svGo").onclick=function(){var r=normRoom($("svRoom").value);if(r.length!==8){toast(t("jv.badRoom"),"err");return}SV.room=r;svConnect()}}
  svTick();
}
function svTick(){
  if(!SV)return;var el=$("svTime");
  if(el&&SV.timer){var r=svRem(),d=SV.timer;el.textContent=fmt(r);el.classList.toggle("warn",r>0&&r<=60);el.classList.toggle("done",r<=0);el.classList.toggle("beat",d.run&&r>0&&r<=10);
    var bar=$("svBar");if(bar)bar.style.width=(d.total?(100*(1-r/d.total)):0).toFixed(2)+"%"}
  var mini=$("svMini");if(mini&&SV.timer){var p=PH[SV.timer.i]||PH[0];mini.textContent=t(p.t)+" · "+fmt(svRem())}
  var cd=$("svCd");if(cd&&SV.reveal&&SV.reveal.state==="cd"){var left=Math.max(1,SV.reveal.n-Math.floor((Date.now()-SV.cdStart)/1000));if(cd.textContent!==String(left)){cd.textContent=left;tick()}}
}

/* ---------------- MODE BOOT ---------------- */
var MODE="admin";
(function(){var m=(location.hash||"").match(/^#(judge|screen)(?:=([A-Za-z0-9-]+))?/);if(m)MODE=m[1];
  if(MODE!=="admin"){document.body.classList.add("mode-"+MODE);$("modeApp").hidden=false;}
})();
/* =========================================================
   RENDER ALL + BOOT
========================================================= */
function renderAllData(){renderTeams();renderBracket();renderLb();fillMatchSel();renderJudge();renderStats()}
function renderAll(){if(typeof MODE!=="undefined"){if(MODE==="judge"&&JV)renderJV();else if(MODE==="screen"&&SV)renderSV();else renderLive()}renderForm();renderStats();renderTeams();renderBracket();renderCases();renderTimers();fillMatchSel();renderJudge();renderLb();renderSyncIdle();if(!$("presOv").hidden)paintPres()}
applyI18n();renderForm();renderAll();showTab(curTab);
(function(){var m=(location.hash||"").match(/^#(judge|screen)(?:=([A-Za-z0-9-]+))?/);
  if(MODE==="judge")bootJudge(m&&m[2]);else if(MODE==="screen")bootScreen(m&&m[2]);
  else{renderLive();renderPill();if(cfg.liveOn){LV.hubAge=Date.now();liveStart();setTimeout(renderLive,12500)}}
})();
})();
</script>
